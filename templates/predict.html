{% extends "base.html" %}

{% block title %}Predict{% endblock %}

{% block content %}
<header>
    <h1>Predict Employee Performance</h1>
</header>
<form action="{{ url_for('predict') }}" method="POST">

    <h4 class="mt-3 mb-3">Employee Profile</h4>
    <div class="form-row">
        <div class="form-group col-md-6">
            <label for="employee_name">Employee Name:</label>
            <input type="text" id="employee_name" name="employee_name" class="form-control" placeholder="Enter employee name">
        </div>
        <div class="form-group col-md-6">
            <label for="employee_id">Employee ID:</label>
            <input type="text" id="employee_id" name="employee_id" class="form-control" placeholder="Enter employee ID">
        </div>
    </div>

    <h4 class="mt-3 mb-3">Work Details</h4>
    <div class="form-row">
        <div class="form-group col-md-6">
            <label for="quarter">Quarter (1–5):</label>
            <input type="number" id="quarter" name="quarter" class="form-control" min="1" max="5" placeholder="e.g. 1">
        </div>
        <div class="form-group col-md-6">
            <label for="department">Department (encoded):</label>
            <input type="number" id="department" name="department" class="form-control" min="0" placeholder="e.g. 0">
        </div>
    </div>
    <div class="form-row">
        <div class="form-group col-md-6">
            <label for="day">Day (encoded):</label>
            <input type="number" id="day" name="day" class="form-control" min="0" placeholder="e.g. 0">
        </div>
        <div class="form-group col-md-6">
            <label for="team">Team (1–12):</label>
            <input type="number" id="team" name="team" class="form-control" min="1" max="12" placeholder="e.g. 1">
        </div>
    </div>
    <div class="form-row">
        <div class="form-group col-md-6">
            <label for="targeted_productivity">Targeted Productivity (0–1):</label>
            <input type="number" step="0.01" id="targeted_productivity" name="targeted_productivity" class="form-control" min="0" max="1" placeholder="e.g. 0.75">
        </div>
        <div class="form-group col-md-6">
            <label for="smv">SMV (Standard Minute Value):</label>
            <input type="number" step="0.01" id="smv" name="smv" class="form-control" min="0" placeholder="e.g. 26.16">
        </div>
    </div>
    <div class="form-row">
        <div class="form-group col-md-6">
            <label for="over_time">Over Time (minutes):</label>
            <input type="number" id="over_time" name="over_time" class="form-control" min="0" placeholder="e.g. 7080">
        </div>
        <div class="form-group col-md-6">
            <label for="incentive">Incentive (BDT):</label>
            <input type="number" id="incentive" name="incentive" class="form-control" min="0" placeholder="e.g. 98">
        </div>
    </div>
    <div class="form-row">
        <div class="form-group col-md-6">
            <label for="idle_time">Idle Time (minutes):</label>
            <input type="number" step="0.01" id="idle_time" name="idle_time" class="form-control" min="0" placeholder="e.g. 0">
        </div>
        <div class="form-group col-md-6">
            <label for="idle_men">Idle Men:</label>
            <input type="number" id="idle_men" name="idle_men" class="form-control" min="0" placeholder="e.g. 0">
        </div>
    </div>
    <div class="form-row">
        <div class="form-group col-md-6">
            <label for="no_of_style_change">No. of Style Changes:</label>
            <input type="number" id="no_of_style_change" name="no_of_style_change" class="form-control" min="0" placeholder="e.g. 0">
        </div>
        <div class="form-group col-md-6">
            <label for="no_of_workers">No. of Workers:</label>
            <input type="number" step="1" id="no_of_workers" name="no_of_workers" class="form-control" min="0" placeholder="e.g. 59">
        </div>
    </div>
    <div class="form-group">
        <label for="month">Month (1–12):</label>
        <input type="number" id="month" name="month" class="form-control" min="1" max="12" placeholder="e.g. 1">
    </div>

    <button type="submit" class="btn btn-primary">Predict Performance</button>
</form>
{% endblock %}
